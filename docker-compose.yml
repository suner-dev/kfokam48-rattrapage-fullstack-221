services:
  db:
    image: postgres:16-alpine
    container_name: ticketflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ticketflow
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports:
      - "5434:5434"
    command: -c port=5434
    volumes:
      - ticketflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -p 5434"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ticketflow_data:
