spring:
  datasource:
    url: jdbc:h2:mem:ticketflow;mode=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

app:
  cors:
    allowed-origins: http://localhost:5173
