# ============================
# Datasource PostgreSQL (Docker)
# ============================
spring.datasource.url=jdbc:postgresql://localhost:5434/ticketflow
spring.datasource.username=ticketflow
spring.datasource.password=ticketflow
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================
# JPA / Hibernate
# ============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================
# Springdoc OpenAPI / Swagger
# ============================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/api/v3/api-docs
springdoc.packages-to-scan=com.ticketflow.controller

# ============================
# Serveur
# ============================
server.port=8080
